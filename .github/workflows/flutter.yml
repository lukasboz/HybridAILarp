name: Flutter

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: bash scripts/flutter.sh pub get
      - run: bash scripts/flutter.sh analyze
      - run: bash scripts/flutter.sh test
      # Linux renders of mismatched screenshots; *_testImage.png files can replace the baselines.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: app/test/failures
          if-no-files-found: ignore
      - run: bash scripts/flutter.sh build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v7
        with:
          name: flutter-web
          path: app/build/web

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:rules

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: bash scripts/flutter.sh build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Compile AOT development build for local signing
        run: bash scripts/flutter.sh build ios --release --no-codesign --dart-define=APP_CHECK_DEBUG=true
      - name: Preserve app permissions and framework symlinks
        run: tar -C app/build/ios/iphoneos -czf app/build/ios/MeetHalfway-unsigned-app.tar.gz Runner.app
      - uses: actions/upload-artifact@v7
        with:
          name: ios-development-unsigned-app
          path: app/build/ios/MeetHalfway-unsigned-app.tar.gz
