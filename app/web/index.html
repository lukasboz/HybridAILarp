<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Good plans, together. Find an activity your whole group can get behind.">
  <meta name="theme-color" content="#f3f8fc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MeetHalfway">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>MeetHalfway · Good plans, together.</title>
  <style>html,body{margin:0;background:#f3f8fc}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;font:13px system-ui,sans-serif;color:#38586f}#loading strong{font-size:23px;font-weight:500;letter-spacing:-1px;color:#001b2e}#loading p{margin-top:14px}</style>
</head>
<body>
  <div id="loading" role="status"><strong>meethalfway</strong><p>Making room for everyone.</p></div>
  <script>
    window.addEventListener('flutter-first-frame',()=>document.getElementById('loading')?.remove());
    // Retire the previous HTML app's cache when this build replaces it.
    if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.filter(r=>r.active?.scriptURL.endsWith('/sw.js')||r.active?.scriptURL.endsWith('/flutter_service_worker.js')).map(r=>r.unregister()))).catch(()=>{});}
    if('caches' in window){caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('meethalfway-')).map(k=>caches.delete(k)))).catch(()=>{});}
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
