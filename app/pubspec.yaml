name: meet_halfway
description: General group plans, with one shared Flutter interface.
publish_to: none
version: 0.4.0+5

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.1'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  firebase_app_check: ^0.5.2
  firebase_ai: ^5.2.0
  firebase_remote_config: ^7.1.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  web: ^1.1.2
  flutter_edge_ai: ^2.7.1
  flutter_edge_ai_litertlm: ^1.21.0
  firebase_messaging: ^17.1.0
  connectivity_plus: ^7.3.2
  app_links: ^7.2.2
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/shared/experience.json
    - assets/shared/design-tokens.json
    - assets/activities/
    - assets/firebase.json
    - assets/fonts/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
